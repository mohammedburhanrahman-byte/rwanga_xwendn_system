<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی  پرۆژەی زانکۆی دڵخوازم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root{
    --navy:#0B2545;
    --navy-2:#123a6b;
    --navy-soft:#e8edf5;
    --green:#0f8a55;
    --green-2:#17b46e;
    --green-pale:#e5f6ee;
    --white:#ffffff;
    --bg:#f3f7f5;
    --text:#122318;
    --muted:#5c7269;
    --danger:#c0392b;
    --warn:#b8860b;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(11,37,69,.10);
    --shadow-sm:0 4px 12px rgba(11,37,69,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:'Rabar','Rabar 013',Tahoma,Arial,sans-serif;font-size:14px;margin:0;padding:0;overflow-x:hidden;}
  /* iOS Safari sometimes won't register taps on plain elements (div/span) that only have
     an onclick attribute unless they look "clickable" (cursor:pointer). This makes every
     clickable element in the app reliably tappable on iPhone. */
  [onclick]{cursor:pointer;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(15,138,85,.12), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(11,37,69,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    direction:rtl;
  }
  #app{min-height:100vh;min-height:100dvh;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  /* Safari/iOS zooms the page in automatically when a focused input has font-size under 16px.
     Setting 16px as the baseline everywhere below stops that jump. */

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    width:100%;max-width:960px;background:var(--white);border-radius:24px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;
  }
  .login-side{
    background:linear-gradient(160deg,var(--navy) 0%, var(--navy-2) 55%, var(--green) 140%);
    color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;
  }
  .login-side::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(400px 300px at 90% 10%, rgba(255,255,255,.10), transparent 60%);
  }
  .brand-mark{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand-mark svg{width:46px;height:46px;flex:none;}
  .brand-title{font-size:20px;font-weight:800;letter-spacing:.2px;}
  .brand-sub{font-size:12.5px;opacity:.8;margin-top:2px;}
  .login-tagline{position:relative;z-index:1;}
  .login-tagline h1{font-size:28px;line-height:1.5;font-weight:800;margin:0 0 10px;}
  .login-tagline p{font-size:14px;opacity:.85;line-height:1.9;margin:0;}
  .login-foot{font-size:11.5px;opacity:.65;position:relative;z-index:1;}

  .login-form{padding:48px 40px;display:flex;flex-direction:column;justify-content:center;}
  .role-tabs{display:flex;gap:8px;background:var(--bg);padding:6px;border-radius:12px;margin-bottom:26px;}
  .role-tab{flex:1;padding:10px;text-align:center;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);background:transparent;transition:.15s;}
  .role-tab.active{background:var(--white);color:var(--navy);box-shadow:var(--shadow-sm);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #dfe7e3;background:#fbfdfc;
    font-size:16px;color:var(--text);transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-pale);
  }
  .btn{
    padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s;
  }
  .btn-primary{background:linear-gradient(90deg,var(--green),var(--green-2));color:#fff;box-shadow:0 8px 18px rgba(15,138,85,.25);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid #dfe7e3;color:var(--text);}
  .btn-outline:hover{border-color:var(--green);}
  .btn-danger{background:#fdecea;color:var(--danger);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;}
  .btn-block{width:100%;}
  .login-error{background:#fdecea;color:var(--danger);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center;}

  @media (max-width:820px){
    .login-card{grid-template-columns:1fr;}
    .login-side{display:none;}
  }

  /* ---------- App shell ---------- */
  .shell{display:flex;min-height:100vh;min-height:100dvh;}
  .sidebar{
    width:260px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;height:100dvh;
  }
  .sidebar-brand{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-brand svg{width:34px;height:34px;flex:none;}
  .sidebar-brand .t1{font-weight:800;font-size:12.5px;line-height:1.5;}
  .sidebar-brand .t2{font-size:10.5px;opacity:.65;}
  .nav-group{padding:14px 12px;overflow-y:auto;flex:1;}
  .nav-label{font-size:10.5px;color:rgba(255,255,255,.45);padding:10px 10px 4px;font-weight:700;letter-spacing:.4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;
    color:rgba(255,255,255,.78);margin-bottom:3px;transition:.15s;cursor:pointer;
  }
  .nav-item svg{width:18px;height:18px;flex:none;opacity:.85;}
  /* Most icons in this app never actually had their size set (a `.replace('width="24"',...)`
     trick was used, but the icons never contained that string, so it silently did nothing).
     This gives every icon a sane default size; the more specific rules below/above
     (e.g. .stat-card svg, .brand-mark svg) still win where a different size is wanted. */
  svg{width:18px;height:18px;flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:linear-gradient(90deg,var(--green),var(--green-2));color:#fff;box-shadow:0 6px 16px rgba(15,138,85,.35);}
  .sidebar-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:rgba(255,255,255,.45);}

  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:68px;flex:none;background:#fff;border-bottom:1px solid #e7efe9;display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;
  }
  .topbar h2{font-size:17px;margin:0;font-weight:800;color:var(--navy);}
  .topbar .sub{font-size:11.5px;color:var(--muted);}
  .user-chip{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--navy));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  }
  .user-meta{font-size:12px;}
  .user-meta .name{font-weight:700;color:var(--text);}
  .user-meta .role{color:var(--muted);}
  .menu-btn{background:none;padding:6px;border-radius:8px;color:var(--muted);}
  .menu-btn:hover{background:var(--bg);}

  .content{padding:26px 28px 60px;flex:1;}
  .grid{display:grid;gap:18px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  @media(max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr;}}

  .card{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);border:1px solid #eef3f0;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .stat-card{padding:20px;}
  .stat-card .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .stat-card .value{font-size:28px;font-weight:800;color:var(--navy);}
  .stat-card .icon-wrap{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .stat-card svg{width:22px;height:22px;}
  .stat-card.clickable{cursor:pointer;transition:.15s;}
  .stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(11,37,69,.14);}
  .city-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .city-summary .city-pill{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid #e5ece8;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--text);}
  .city-summary .city-pill strong{color:var(--green);}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.form-row{grid-template-columns:1fr;}}
  .checks{display:flex;flex-wrap:wrap;gap:10px;}
  .check-pill{
    display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid #dfe7e3;
    font-size:13px;font-weight:600;cursor:pointer;background:#fbfdfc;transition:.15s;
  }
  .check-pill input{accent-color:var(--green);width:15px;height:15px;}
  .check-pill.checked{background:var(--green-pale);border-color:var(--green);color:var(--green);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:right;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;
    border-bottom:2px solid #eef3f0;white-space:nowrap;
  }
  tbody td{padding:12px;border-bottom:1px solid #f1f5f2;vertical-align:middle;}
  tbody tr:hover{background:#fafcfb;}
  .table-wrap{overflow-x:auto;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-green{background:var(--green-pale);color:var(--green);}
  .badge-navy{background:var(--navy-soft);color:var(--navy);}
  .badge-gray{background:#f0f0f0;color:#666;}
  .badge-danger{background:#fdecea;color:var(--danger);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .toolbar-left, .toolbar-right{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-box{position:relative;}
  .search-box input{padding-right:36px;min-width:240px;}
  .search-box svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.5;}
  .empty-state p{font-size:13.5px;margin:4px 0 0;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,20,17,.55);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;backdrop-filter:blur(2px);
  }
  .modal{
    background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 30px 60px rgba(0,0,0,.3);
  }
  .modal-head{padding:20px 24px;border-bottom:1px solid #eef3f0;display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;font-weight:800;color:var(--navy);}
  .modal-close{width:32px;height:32px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .modal-body{padding:24px;}
  .modal-foot{padding:16px 24px;border-top:1px solid #eef3f0;display:flex;gap:10px;justify-content:flex-start;}

  .upload-overlay{
    position:fixed;inset:0;z-index:500;background:rgba(11,37,69,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;
  }
  .upload-overlay-card{
    background:#fff;border-radius:18px;padding:30px 36px;box-shadow:0 20px 50px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;gap:14px;min-width:220px;text-align:center;
  }
  .upload-spinner{
    width:42px;height:42px;border-radius:50%;border:4px solid var(--green-pale);border-top-color:var(--green);
    animation:spin .8s linear infinite;
  }
  .upload-overlay-text{font-size:13.5px;font-weight:700;color:var(--navy);}
  .upload-overlay-sub{font-size:11.5px;color:var(--muted);}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .toast-wrap{position:fixed;bottom:24px;left:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{
    padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;min-width:220px;animation:slideUp .2s ease;color:#fff;
  }
  .toast-success{background:linear-gradient(90deg,var(--green),var(--green-2));}
  .toast-error{background:var(--danger);}
  .toast-info{background:var(--navy);}
  @keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .tab-strip{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:11px;margin-bottom:18px;width:fit-content;}
  .tab-strip button{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);background:transparent;}
  .tab-strip button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm);}

  .qr-box{background:#fff;border:2px dashed #dfe7e3;border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .id-card{
    width:320px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #eef3f0;
  }
  .id-card-head{background:linear-gradient(120deg,var(--navy),var(--green));color:#fff;padding:14px 16px;}
  .id-card-head .t1{font-size:12px;opacity:.85;}
  .id-card-head .t2{font-weight:800;font-size:14.5px;}
  .id-card-body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;}
  .id-card-body .name{font-weight:800;font-size:15px;color:var(--navy);}
  .id-card-body .meta{font-size:11.5px;color:var(--muted);}

  .video-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;max-width:420px;margin:0 auto;}
  .video-wrap video{width:100%;display:block;}
  .scan-frame{position:absolute;inset:14%;border:3px solid var(--green-2);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);}

  .settings-block{margin-bottom:26px;}
  .settings-block:last-child{margin-bottom:0;}
  pre.code-box{
    background:#0B2545;color:#d7f5e6;padding:16px;border-radius:12px;font-size:11.5px;line-height:1.8;
    overflow-x:auto;direction:ltr;text-align:left;white-space:pre;
  }
  .note-box{background:var(--green-pale);color:#0f5c39;padding:12px 16px;border-radius:10px;font-size:12.5px;line-height:1.8;margin-bottom:14px;}
  .note-box.warn{background:#fff6e0;color:#7a5c00;}

  .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .profile-avatar{
    width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--navy));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none;
  }
  .kv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;}
  .kv-list .kv{background:var(--bg);border-radius:10px;padding:10px 12px;}
  .kv-list .kv .k{color:var(--muted);font-size:11px;margin-bottom:3px;}
  .kv-list .kv .v{font-weight:700;color:var(--text);}

  .mobile-toggle{display:none;}
  @media(max-width:900px){
    .sidebar{position:fixed;right:0;top:0;z-index:60;transform:translateX(100%);transition:.2s;}
    .sidebar.open{transform:translateX(0);}
    .mobile-toggle{display:flex;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
    .sidebar-overlay.open{display:block;}
  }

  /* Extra tightening for small phone screens so nothing crowds or overflows */
  @media(max-width:480px){
    .content{padding:16px 14px 50px;}
    .topbar{padding:0 14px;height:auto;min-height:60px;flex-wrap:wrap;gap:8px;}
    .topbar h2{font-size:15px;}
    .card{padding:16px;}
    .login-wrap{padding:14px;}
    .login-form{padding:30px 20px;}
    .kv-list{grid-template-columns:1fr;}
    .profile-head{flex-wrap:wrap;}
    .video-wrap{max-width:100%;}
    .modal-body{padding:18px;}
    .modal-head, .modal-foot{padding:14px 18px;}
  }

/* Added city grouping and profile-photo zoom */
.city-group{margin-bottom:14px;border:1px solid #e7eee9;border-radius:12px;overflow:hidden;background:#fff}
.city-group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);font-weight:800}
.city-group-head .count{font-size:12px;color:var(--muted);font-weight:700}
.city-group-body{padding:10px}
.city-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.city-filter-btn{border:1px solid #dfe8e2;background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px}
.city-filter-btn.active{background:var(--green-pale);border-color:var(--green);color:#0f5c39;font-weight:800}
.profile-photo-click{cursor:zoom-in}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ==================== ICONS ==================== */
const ICONS = {
  logo: `<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" fill="white" fill-opacity=".12"/><path d="M24 14C15 14 8 24 8 24C8 24 15 34 24 34C33 34 40 24 40 24C40 24 33 14 24 14Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="24" cy="24" r="6.5" fill="#17b46e"/><path d="M20.8 24.2l2.3 2.3l4.3-4.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  dashboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>`,
  student: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 4.2-6 7.5-6s6 2 7.5 6"/></svg>`,
  course: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H17a2 2 0 0 1 2 2v13.5a1 1 0 0 1-1.5.87L14 18l-3.5 2.37a1 1 0 0 1-1.5-.87V6H5.5A1.5 1.5 0 0 0 4 7.5"/><path d="M4 5.5V17a1.5 1.5 0 0 0 1.5 1.5H9"/></svg>`,

function photoSrc(url){
  if(!url) return '';

    const m = url.match(/[-\w]{20,}/);
    if(m) return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1000`;
  }
  return url;
}

async function apiGet(){
  const url = getSheetsUrl();
  if(!url) return null;
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(url + sep + 'token=' + encodeURIComponent(getSheetsToken()) + '&t=' + Date.now());
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
/* ==================== FILE UPLOAD (photo / CV → Google Drive) ==================== */
const MAX_FILE_MB = 10;

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = ()=> reject(new Error('read_failed'));
    reader.readAsDataURL(file);
  });
}

/* وێنەکان (بۆ نموونە وێنەی کامێرای مۆبایل کە زۆرجار چەند مێگابایتە) پێش ناردن بچووک و کۆمپرێس دەکرێن.
   ئەمە خێرایی بارکردن زۆر بەرز دەکاتەوە، چونکە قەبارەی داتای نێردراو بۆ Apps Script کەم دەبێتەوە.
   فایلی سیڤی (PDF/Word) وەک خۆی دەمێنێتەوە، چونکە ناتوانرێت وێنە بکرێت. */
function compressImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve)=>{
    if(!file.type || !file.type.startsWith('image/') || file.type==='image/gif'){
      resolve(file); return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width>maxDim || height>maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        if(!blob || blob.size >= file.size){ resolve(file); return; } // ئەگەر کۆمپرێسکردن یارمەتی نەدا، فایلی سەرەکی بەکاربهێنە
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' }));
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* kind: 'photo' | 'cv' — فایلەکە دەنێردرێت بۆ Code.gs، ئەویش لەناو Google Drive هەڵیدەگرێت
   و { id, url } دەگەڕێنێتەوە. لە کاتی هەڵە، توست پیشان دەدات و null دەگەڕێنێتەوە. */
async function uploadFile(file, kind){
  if(!file) return null;
  if(file.size > MAX_FILE_MB*1024*1024){
    showToast(`قەبارەی فایل (${kind==='cv'?'سیڤی':'وێنە'}) نابێت زیاتر لە ${MAX_FILE_MB}MB بێت`, 'error');
    throw new Error('file_too_large');
  }
  try{
    const toSend = kind==='photo' ? await compressImage(file) : file;
    const base64 = await fileToBase64(toSend);
    const res = await apiPost({ action:'uploadFile', kind, fileName:toSend.name, mimeType:toSend.type, fileData: base64 });
    if(!res || !res.id || !res.url) throw new Error('upload_failed');
    return { id: res.id, url: res.url };
  }catch(e){
    console.error('uploadFile failed', e);
    showToast(`بارکردنی ${kind==='cv'?'سیڤی':'وێنە'} سەرنەکەوت`, 'error');
    throw e;
  }
}

async function apiPost(payload){
  const url = getSheetsUrl();
  if(!url) return null;
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token:getSheetsToken() }, payload)),
  });
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

/* هەموو داتای هاوبەش، لەگەڵ وەشانی نیشاندانی خۆشەکراو بۆ خودی شیتەکە، بە یەک ناردن دەنێردرێت */
async function syncToSheets(){
  if(!isSheetsConfigured()) return;
  syncPending = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    if(!syncPending) return;
    syncPending = false;
    setSyncBadge('busy');
    try{
      await apiPost({
        raw:{
          courses: state.courses,
          students: state.students,
          attendance: state.attendance,
          accounts: state.accounts,
        },
        display:{
          courses: state.courses.map(c=>({ id:c.id, name:c.name })),
          students: state.students.map(s=>({
            id:s.id, fullName:s.fullName, age:s.age, mobile:s.mobile, gender:s.gender, profession:s.profession, city:s.city||'',
            courseNames: s.courseIds.map(id=>courseName(id)).join('، '), createdAt:s.createdAt,
            photo: s.photoUrl ? `=IMAGE("${s.photoUrl}")` : '',
            cv: s.cvUrl ? `=HYPERLINK("${s.cvUrl}","کردنەوەی سیڤی")` : '',
          })),
          attendance: state.attendance.map(a=>({ id:a.id, studentName:studentName(a.studentId), courseName:courseName(a.courseId), date:a.date, time:a.time, method:a.method, markedBy:a.markedBy })),
        },
      });
      setSyncBadge('ok');
    }catch(e){
      console.error('sync failed', e);
      setSyncBadge('error');
      showToast('هاوکاتکردن لەگەڵ Google Sheets سەرنەکەوت — پەیوەندی ئینتەرنێت بپشکنە', 'error');
    }
  }, 400);
}

   ئەگەر وابێت، ڕیفرێشەکە خانەکانی فۆرم پاک ناکاتەوە (بۆ نموونە فۆرمی تۆمارکردنی قوتابی
   کە کاتێکی زۆرتری پێویستە بۆ پڕکردنەوە، بەتایبەت بارکردنی وێنە/سیڤی). */
function isEditingForm(){
  const vc = document.getElementById('viewContent');
  if(!vc) return false;
  if(state.currentView === 'register') return true;
  const el = document.activeElement;
  if(el && vc.contains(el) && ['INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return true;
  return false;
}

function startBackgroundSync(){
  setInterval(async ()=>{
    if(!state.session || !isSheetsConfigured()) return;
    if(document.getElementById('modalOverlay')) return; // مۆداڵێک کراوەیە، ناوەخۆ مەکە
    try{
      const data = await apiGet();
      if(!data) return;
      state.courses = data.courses || state.courses;
      state.students = data.students || state.students;
      state.attendance = data.attendance || state.attendance;
      state.accounts = data.accounts || state.accounts;
      if(state.ready && state.session && !isEditingForm()){
        const vc = document.getElementById('viewContent');
        if(vc) vc.innerHTML = renderView();
      }
    }catch(e){ /* بێدەنگ، دواتر هەوڵ دەداتەوە */ }
  }, 20000);
}

function showToast(msg, type='success'){
  const wrap = document.getElementById('toastWrap');

  el.innerHTML = (type==='success'?ICONS.check:type==='error'?ICONS.close:ICONS.cloud).replace('width:24','width:16') + `<span>${msg}</span>`;
  el.querySelector('svg').style.width='16px'; el.querySelector('svg').style.height='16px'; el.querySelector('svg').style.flex='none';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(8px)'; el.style.transition='.2s'; setTimeout(()=>el.remove(),200); }, 2600);
}

let loginRole = 'admin';
function setLoginRole(r){ loginRole = r; render(); }

async function doLogin(ev){
  ev.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const acc = state.accounts.find(a=> a.username===u && a.password===p && a.role===loginRole);
  const errBox = document.getElementById('loginErr');
  if(!acc){
    if(errBox){ errBox.style.display='block'; errBox.textContent = 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە، یان ڕۆڵ ڕاست نییە.'; }
    return;
  }
  state.session = { username: acc.username, role: acc.role, name: acc.name };
  await saveSession();
  state.currentView = 'dashboard';
  render();
  showToast('بەخێربێیت ' + acc.name, 'success');
}

async function doLogout(){
  state.session = null;
  await saveSession();
  render();
}

/* ==================== NAV ==================== */
function go(view){
  state.currentView = view;
  state.sidebarOpen = false;
  render();
}

/* ==================== RENDER ROOT ==================== */
function render(){
  const app = document.getElementById('app');
  if(!state.ready){
    app.innerHTML = `<div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;color:#5c7269;font-size:14px;">چاوەڕوان بە، سیستەم بار دەبێت...</div>`;
    return;
  }
  if(state.needsSetup){
    app.innerHTML = renderSetup();
    return;
  }
  if(state.loadError){
    app.innerHTML = renderLoadError();
    return;
  }
  if(!state.session){
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  app.innerHTML = renderShell();
  attachShellEvents();
}

/* ==================== DASHBOARD ==================== */
function renderDashboard(){
  const today = todayStr();
  const todayCount = state.attendance.filter(a=>a.date===today).length;
  const cards = [
    { label:'کۆی قوتابیان', value: state.students.length, icon: ICONS.student, bg:'var(--green-pale)', color:'var(--green)', click:"showStudentsByCity('کۆی قوتابیان بە پێی شار', state.students)" },
    { label:'کۆی کۆرسەکان', value: state.courses.length, icon: ICONS.course, bg:'var(--navy-soft)', color:'var(--navy)', click:"showCoursesWithStudents()" },
    { label:'ئامادەیی ئەمڕۆ', value: todayCount, icon: ICONS.attendance, bg:'var(--green-pale)', color:'var(--green)', click:"showAttendanceByCity('ئامادەیی ئەمڕۆ بە پێی شار', state.attendance.filter(a=>a.date===today))" },
    { label:'کۆی تۆمارەکانی ئامادەیی', value: state.attendance.length, icon: ICONS.report, bg:'var(--navy-soft)', color:'var(--navy)', click:"showAttendanceByCity('کۆی تۆمارەکانی ئامادەیی بە پێی شار', state.attendance)" },
  ];
  const recent = [...state.attendance].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).slice(0,8);
  const todayCityCounts = {};
  state.attendance.filter(a=>a.date===today).forEach(a=>{
    const s = studentById(a.studentId);
    const city = s && s.city ? s.city : 'شار دیارینەکراوە';
    todayCityCounts[city] = (todayCityCounts[city]||0) + 1;
  });
  return `
  <div class="grid grid-4" style="margin-bottom:18px;">
    ${cards.map(c=>`
      <div class="card stat-card clickable" onclick="${c.click}" title="کلیک بکە بۆ وردەکاری">
        <div class="icon-wrap" style="background:${c.bg};color:${c.color};">${c.icon}</div>
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
      </div>`).join('')}
  </div>
  <div class="grid grid-2">
    <div class="card">
      <h3>${ICONS.attendance.replace('width="24"','width="17"')} دوایین تۆمارەکانی ئامادەیی</h3>
      ${Object.keys(todayCityCounts).length ? `
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">ژمارەی ئامادەبووانی ئەمڕۆ بە پێی شار</div>
        <div class="city-summary">${Object.entries(todayCityCounts).sort((a,b)=>b[1]-a[1]).map(([city,count])=>`<span class="city-pill">${city} <strong>${count}</strong></span>`).join('')}</div>` : ''}
      ${recent.length===0 ? emptyState('هیچ تۆمارێکی ئامادەیی نییە') : `
      <div class="table-wrap" style="margin-top:12px;"><table>
        <thead><tr><th>قوتابی</th><th>شار</th><th>کۆرس</th><th>بەروار</th><th>کات</th><th>شێواز</th></tr></thead>
        <tbody>${recent.map(a=>{
          const s=studentById(a.studentId);
          return `<tr><td>${studentName(a.studentId)}</td><td><span class="badge badge-gray">${s&&s.city?s.city:'—'}</span></td><td><span class="badge badge-navy">${courseName(a.courseId)}</span></td><td>${a.date}</td><td>${a.time}</td><td>${a.method==='qr'?'<span class="badge badge-green">کیو ئار</span>':'<span class="badge badge-gray">دەستی</span>'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>`}
    </div>
    <div class="card">
      <h3>${ICONS.course.replace('width="24"','width="17"')} کۆرسەکان</h3>
      ${state.courses.length===0 ? emptyState('هیچ کۆرسێک زیاد نەکراوە') : `
      <div style="display:flex;flex-direction:column;gap:10px;">${state.courses.map(c=>{
        const cnt=state.students.filter(s=>s.courseIds.includes(c.id)).length;
        return `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);padding:11px 14px;border-radius:10px;cursor:pointer;" onclick="showCourseStudents('${c.id}')"><span style="font-weight:700;font-size:13.5px;">${c.name}</span><span class="badge badge-green">${cnt} قوتابی</span></div>`;
      }).join('')}</div>`}
    </div>
  </div>`;
}

function showStudentsByCity(title, students){
  const groups={};
  (students||[]).forEach(s=>{const city=s.city||'شار دیارینەکراوە';(groups[city] ||= []).push(s);});
  const cities=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ckb'));
  const body=cities.length?cities.map(city=>`
    <div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--green-pale);padding:10px 12px;border-radius:10px;margin-bottom:8px;"><strong>${city}</strong><span class="badge badge-green">${groups[city].length} قوتابی</span></div>
      <div style="display:flex;flex-direction:column;gap:7px;">${groups[city].map(s=>`
        <div style="display:flex;align-items:center;gap:10px;background:var(--bg);padding:9px 10px;border-radius:9px;cursor:pointer;" onclick="closeModal();go('profiles');setTimeout(()=>selectProfile('${s.id}'),0)">
          ${s.photoUrl?`<img src="${photoSrc(s.photoUrl)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;" onerror="this.outerHTML='<div class=&quot;avatar&quot; style=&quot;width:34px;height:34px;font-size:12px;&quot;>${initials(s.fullName)}</div>'">`:`<div class="avatar" style="width:34px;height:34px;font-size:12px;">${initials(s.fullName)}</div>`}
          <div style="flex:1;"><div style="font-weight:700;font-size:13px;">${s.fullName}</div><div style="font-size:11px;color:var(--muted);">${s.mobile||''}</div></div>
        </div>`).join('')}</div>
    </div>`).join(''):emptyState('هیچ قوتابیەک نییە');
  openModal(title,body);
}

function showCoursesWithStudents(){
  const body=state.courses.length?state.courses.map(c=>{
    const students=state.students.filter(s=>s.courseIds.includes(c.id));
    return `<div style="margin-bottom:16px;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--navy-soft);padding:10px 12px;border-radius:10px;margin-bottom:8px;"><strong>${c.name}</strong><span class="badge badge-navy">${students.length} قوتابی</span></div>
    ${students.length?`<div style="display:flex;flex-direction:column;gap:7px;">${students.map(s=>`<div style="display:flex;align-items:center;gap:10px;background:var(--bg);padding:9px 10px;border-radius:9px;cursor:pointer;" onclick="closeModal();go('profiles');setTimeout(()=>selectProfile('${s.id}'),0)"><div class="avatar" style="width:34px;height:34px;font-size:12px;">${initials(s.fullName)}</div><div style="font-weight:700;font-size:13px;">${s.fullName}</div></div>`).join('')}</div>`:`<div style="font-size:12px;color:var(--muted);padding:4px;">هیچ قوتابییەک لەم کۆرسەدا نییە.</div>`}</div>`;
  }).join(''):emptyState('هیچ کۆرسێک نییە');
  openModal('کۆرسەکان و قوتابیان',body);
}

function showCourseStudents(courseId){
  const c=courseById(courseId);
  if(!c)return;
  showStudentsByCity(`قوتابیانی ${c.name} بە پێی شار`,state.students.filter(s=>s.courseIds.includes(courseId)));
}

function showAttendanceByCity(title,records){
  const groups={};
  (records||[]).forEach(a=>{const s=studentById(a.studentId);const city=s&&s.city?s.city:'شار دیارینەکراوە';(groups[city] ||= []).push(a);});
  const cities=Object.keys(groups);
  const body=cities.length?cities.sort((a,b)=>groups[b].length-groups[a].length).map(city=>`
    <div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--green-pale);padding:10px 12px;border-radius:10px;margin-bottom:8px;"><strong>${city}</strong><span class="badge badge-green">${groups[city].length} تۆمار</span></div>
      <div style="display:flex;flex-direction:column;gap:7px;">${groups[city].sort((a,b)=>b.time.localeCompare(a.time)).map(a=>`<div style="display:flex;align-items:center;gap:10px;background:var(--bg);padding:9px 10px;border-radius:9px;"><div class="avatar" style="width:34px;height:34px;font-size:12px;">${initials(studentName(a.studentId))}</div><div style="flex:1;"><div style="font-weight:700;font-size:13px;">${studentName(a.studentId)}</div><div style="font-size:11px;color:var(--muted);">${courseName(a.courseId)} · ${a.date} · ${a.time}</div></div></div>`).join('')}</div>
    </div>`).join(''):emptyState('هیچ تۆماری ئامادەیی نییە');
  openModal(title,body);
}

function emptyState(msg){
  return `<div class="empty-state">${ICONS.list}<p>${msg}</p></div>`;
}

/* هەلبژاردنی وێنە دەستبەجێ لە فۆرمەکەدا پیشان دەدرێت، پێش ئەوەی تەنانەت بارکردنی سەرەکی دەست پێ بکات */
function previewRegPhoto(input){
  const img = document.getElementById('regPhotoPreview');
  const file = input.files && input.files[0];
  if(!file){ img.style.display='none'; img.src=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{ img.src = reader.result; img.style.display='block'; };
  reader.readAsDataURL(file);
}

function toggleCoursePill(id){
  const pill = document.getElementById('pill_'+id);
  const checked = pill.querySelector('input').checked;
  pill.classList.toggle('checked', checked);
}

async function submitRegister(ev){
  ev.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const age = document.getElementById('regAge').value;
  const mobile = document.getElementById('regMobile').value.trim();
  const gender = document.getElementById('regGender').value;
  const profession = document.getElementById('regProfession').value.trim();
  const city = document.getElementById('regCity').value;
  const checked = Array.from(document.querySelectorAll('#regCourses input:checked')).map(i=>i.value);
  const photoFile = document.getElementById('regPhoto').files[0];
  const cvFile = document.getElementById('regCv').files[0];

  if(!city){ showToast('تکایە شار هەڵبژێرە', 'error'); return; }
  if(checked.length===0){ showToast('تکایە بەلایەنی کەم یەک کۆرس هەڵبژێرە', 'error'); return; }

  const submitBtn = document.getElementById('regSubmitBtn');
  const originalBtnHtml = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = 'تکایە چاوەڕێ بکە، بارکردنی فایلەکان...';
  showUploadOverlay(
    (photoFile||cvFile) ? 'بارکردنی وێنە/فایلەکان...' : 'تۆمارکردنی قوتابی...',
    (photoFile||cvFile) ? 'ئەمە لەسەر قەبارەی فایل و خێراییی ئینتەرنێت کاتی دەبات' : 'تکایە چاوەڕێ بکە'
  );

  let photo = null, cv = null;
  try{
    // هەردوو فایل بە یەکەوە (پارالێل) دەنێردرێن نەک بە دوای یەکتریدا، بۆ ئەوەی خێراتر تەواو بێت
    [photo, cv] = await Promise.all([
      photoFile ? uploadFile(photoFile, 'photo') : Promise.resolve(null),
      cvFile ? uploadFile(cvFile, 'cv') : Promise.resolve(null),
    ]);
  }catch(e){
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalBtnHtml;
    hideUploadOverlay();
    return; // پەیامی هەڵە پێشتر لە uploadFile پیشان دراوە
  }
  setUploadOverlayText('پاشەکەوتکردنی زانیاری قوتابی...');

  const student = {
    id: uid('st'),
    fullName: name, age: Number(age), mobile, gender, profession, city,
    courseIds: checked,
    photoUrl: photo ? photo.url : '',
    photoFileId: photo ? photo.id : '',
    cvUrl: cv ? cv.url : '',
    cvFileId: cv ? cv.id : '',
    createdAt: new Date().toISOString(),
    createdBy: state.session.name,
  };
  state.students.push(student);
  await saveStudents();
  hideUploadOverlay();
  showToast('قوتابی بە سەرکەوتوویی تۆمارکرا', 'success');
  document.getElementById('registerForm').reset();
  document.querySelectorAll('#regCourses .check-pill').forEach(p=>p.classList.remove('checked'));
  submitBtn.disabled = false;
  submitBtn.innerHTML = originalBtnHtml;
  showIdCard(student.id);
  const vc=document.getElementById('viewContent');
  const scrollY=vc?vc.scrollTop:0;
  if(vc)vc.innerHTML=renderView();
  if(vc)vc.scrollTop=scrollY;
}

  openModal('کارتی قوتابی', `

async function submitEditStudent(id){

  const mobile = document.getElementById('editMobile').value.trim();

  const btn = document.getElementById('editSubmitBtn');

async function submitAddCourse(ev){
  ev.preventDefault();
  const input = document.getElementById('newCourseName');

  showToast('کۆرس زیادکرا', 'success');
  render();
}
async function deleteCourse(id){
  const cnt = state.students.filter(s=>s.courseIds.includes(id)).length;
  if(!confirm(`دڵنیایت لە سڕینەوەی ئەم کۆرسە؟${cnt>0 ? ' ('+cnt+' قوتابی تیایدا تۆمارکراون)' : ''}`)) return;
  state.courses = state.courses.filter(c=>c.id!==id);
  await saveCourses();
  showToast('کۆرس سڕایەوە', 'info');
  render();
}

function renderQrScanBlock(){

function renderManualScanBlock(){
  const enrolled = state.students.filter(s=>s.courseIds.includes(state.scanCourseId));
  const q = (state.searchQuery||'').trim().toLowerCase();
  const filtered = q ? enrolled.filter(s=>s.fullName.toLowerCase().includes(q)) : enrolled;
  const marked = new Set(state.attendance.filter(a=>a.courseId===state.scanCourseId && a.date===state.scanDate).map(a=>a.studentId));
  return `
  <h3>${ICONS.list.replace('width="24"','width="17"')} لیستی قوتابیانی کۆرس</h3>
  <div class="search-box" style="margin-bottom:14px;">

    <input type="text" placeholder="گەڕان بە ناو..." value="${state.searchQuery||''}" oninput="onManualSearch(this.value)" style="width:100%;">
  </div>
  ${filtered.length===0 ? emptyState('هیچ قوتابیەک لەم کۆرسەدا نییە') : `
  <div style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;">
    ${filtered.map(s=>{
      const isMarked = marked.has(s.id);
      return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg);padding:10px 12px;border-radius:10px;">
        <div class="avatar" style="width:32px;height:32px;font-size:11.5px;">${initials(s.fullName)}</div>

        ${isMarked
          ? `<span class="badge badge-green">${ICONS.check.replace('width="24"','width="12"')} ئامادەیە</span>`
          : `<button class="btn btn-primary btn-sm" onclick="markManualAttendance('${s.id}')">تۆمارکردن</button>`}
      </div>`;
    }).join('')}
  </div>`}`;
}

async function recordAttendance(studentId, courseId, method){
  const student = studentById(studentId);
  if(!student){ showToast('قوتابی نەدۆزرایەوە', 'error'); return false; }
  if(!student.courseIds.includes(courseId)){ showToast('ئەم قوتابییە تۆمارکراو نییە لەم کۆرسەدا', 'error'); return false; }
  const dup = state.attendance.find(a=>a.studentId===studentId && a.courseId===courseId && a.date===state.scanDate);
  if(dup){ showToast('پێشتر ئامادەیی ئەم قوتابییە تۆمارکراوە بۆ ئەم ڕۆژە', 'info'); return false; }
  state.attendance.push({
    id: uid('att'), studentId, courseId, date: state.scanDate, time: nowTimeStr(),
    method, markedBy: state.session.name,
  });
  await saveAttendance();
  showToast(student.fullName + ' وەک ئامادە تۆمارکرا', 'success');
  render();
  return true;
}

async function startScanner(){
  const area = document.getElementById('scanArea');
  if(!area) return;
  area.innerHTML = `
    <div class="video-wrap">
      <video id="scanVideo" autoplay playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn btn-outline btn-sm" onclick="stopScanner()">${ICONS.close.replace('width="24"','width="13"')} داخستنی کامێرا</button>
    </div>`;
  if(!window.jsQR){
    area.innerHTML = `<div class="note-box warn">پرۆگرامی خوێندنەوەی کیو ئار بار نەبووە (کێشەی ئینتەرنێت). تکایە پەیجەکە ڕیفرێش بکە و دووبارە هەوڵبدەرەوە.</div>
      <button class="btn btn-primary btn-block" onclick="startScanner()" style="margin-top:10px;">هەوڵدانەوە</button>`;
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 960 },
        height: { ideal: 720 }
      }
    });
    state.scanStream = stream;
    const video = document.getElementById('scanVideo');
    video.srcObject = stream;
    try{ await video.play(); }catch(playErr){ /* some browsers autoplay already, ignore */ }
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tick = ()=>{
      if(!state.scanStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && window.jsQR){
        // Downscale large camera frames before scanning: pure-JS QR decoding on a full
        // high-resolution frame (many phone cameras default to several megapixels) can be
        // slow enough that codes are never detected in time. Capping the working size keeps
        // detection fast and reliable while still giving jsQR enough resolution to read the code.
        const maxDim = 700;
        const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth * scale);
        canvas.height = Math.round(video.videoHeight * scale);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
        if(code && code.data){
          onQrDetected(code.data);
          return;
        }
      }
      state.scanLoopId = requestAnimationFrame(tick);
    };
    state.scanLoopId = requestAnimationFrame(tick);
  }catch(e){
    area.innerHTML = `<div class="note-box warn">نەتوانرا کامێرا کرایەوە. ڕێگە بدە بۆ کامێرا یان بەکاری بگرە لە شێوازی دەستی. (${e.message||'هەڵە'})</div>
      <button class="btn btn-primary btn-block" onclick="startScanner()" style="margin-top:10px;">هەوڵدانەوە</button>`;
  }
}

function stopScanner(){
  if(state.scanLoopId){ cancelAnimationFrame(state.scanLoopId); state.scanLoopId = null; }
  if(state.scanStream){ state.scanStream.getTracks().forEach(t=>t.stop()); state.scanStream = null; }
}

async function onQrDetected(data){
  stopScanner();
  const resultBox = document.getElementById('scanResult');
  const student = studentById(data.trim());
  if(!student){
    if(resultBox) resultBox.innerHTML = `<div class="note-box warn">کیو ئار کۆدەکە هیچ قوتابیەکی بۆ نەدۆزرایەوە.</div>`;
    setTimeout(()=>{ const area=document.getElementById('scanArea'); if(area) startScanner(); }, 1500);
    return;
  }
  const ok = await recordAttendance(student.id, state.scanCourseId, 'qr');
  const area = document.getElementById('scanArea');
  if(area){
    area.innerHTML = `<button class="btn btn-primary btn-block" onclick="startScanner()">${ICONS.camera.replace('width="24"','width="16"')} کردنەوەی کامێرا</button>`;
  }
}

function getReportRows(){
  return state.attendance.filter(a=>{
    const dateOk = a.date === state.reportDate;
    const courseOk = state.reportCourseId==='all' || a.courseId===state.reportCourseId;
    const student = studentById(a.studentId);
    const city = student && student.city ? student.city : 'شار دیارینەکراوە';
    const cityOk = state.reportCityFilter==='all' || city===state.reportCityFilter;
    return dateOk && courseOk && cityOk;
  }).sort((a,b)=>a.time.localeCompare(b.time));
}

function exportCsv(){
  const rows = getReportRows();
  if(rows.length===0){ showToast('هیچ داتایەک نییە بۆ ناردن', 'error'); return; }
  let csv = 'ناوی قوتابی,شار,کۆرس,بەروار,کات,شێواز,تۆمارکەر\n';
  rows.forEach(a=>{
    const s = studentById(a.studentId);
    const city = s && s.city ? s.city : 'شار دیارینەکراوە';
    csv += `"${studentName(a.studentId)}","${city}","${courseName(a.courseId)}","${a.date}","${a.time}","${a.method==='qr'?'کیو ئار':'دەستی'}","${a.markedBy}"\n`;
  });
  const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `raport_${state.reportDate}_${state.reportCityFilter==='all'?'all':state.reportCityFilter}.csv`;
  link.click();
  URL.revokeObjectURL(url);
  showToast('فایلی CSV دابەزێنرا', 'success');
}

/* داتا خۆکارانە لەگەڵ هەموو گۆڕانکارییەک دەنێردرێت بۆ Google Sheets (بڕوانە saveCourses/saveStudents/...).
   ئەم فەنکشنە بۆ ئەوەیە کە بە دەستی نوێترین داتا لە شیتەکەوە بهێنرێتەوە، بۆ نموونە کاتێک چەند کارمەند پێکەوە کاردەکەن. */
async function forceResync(){
  if(!isSheetsConfigured()){ showToast('سەرەتا لینک و TOKENی Google Sheets لە ناو کۆدی فایلەکەدا دابنێ', 'error'); go('settings'); return; }
  try{
    showToast('وەرگرتنی نوێترین داتا...', 'info');
    const data = await apiGet();
    state.courses = data.courses || [];
    state.students = data.students || [];
    state.attendance = data.attendance || [];
    state.accounts = data.accounts || state.accounts;
    showToast('داتا نوێکرایەوە', 'success');
    render();
  }catch(e){
    showToast('هەڵەیەک ڕوویدا لە پەیوەندی بە Google Sheets', 'error');
  }
}

async function deleteStudent(id){
  const s = studentById(id);
  if(!s) return;
  const attCnt = state.attendance.filter(a=>a.studentId===id).length;
  if(!confirm(`دڵنیایت لە سڕینەوەی «${s.fullName}»؟${attCnt>0 ? ' ('+attCnt+' تۆماری ئامادەیی لەگەڵیدا دەسڕدرێتەوە)' : ''}`)) return;
  state.students = state.students.filter(st=>st.id!==id);
  state.attendance = state.attendance.filter(a=>a.studentId!==id);
  if(state.selectedStudentId===id) state.selectedStudentId = null;
  await saveStudents();
  await saveAttendance();
  showToast('قوتابی سڕایەوە', 'info');
  render();
}

      ${results.length===0?emptyState('هیچ قوتابیەک نەدۆزرایەوە'):cityGroupsHtml(results,'selectProfile')}
    </div>
    <div class="card">${selected?renderStudentProfile(selected):`<h3>${ICONS.profile.replace('width="24"','width="17"')} پرۆفایل</h3>${emptyState('قوتابیەک هەڵبژێرە بۆ بینینی زانیارییەکانی')}`}</div>
  </div>`;
}
function onProfileSearch(v){
  state.searchQuery=v;
  const el=document.getElementById('profileSearchResults');
  if(el)el.innerHTML=renderProfileSearchResults();
}
function selectProfile(id){
  state.selectedStudentId=id;
  const vc=document.getElementById('viewContent');
  if(vc)vc.innerHTML=renderView();
}

function showStudentPhoto(studentId){
  const s=studentById(studentId);
  if(!s||!s.photoUrl)return;
  openModal('وێنەی قوتابی',`<div style="display:flex;justify-content:center;align-items:center;padding:4px;"><img src="${photoSrc(s.photoUrl)}" alt="${s.fullName}" style="display:block;max-width:100%;max-height:70vh;border-radius:16px;object-fit:contain;box-shadow:var(--shadow);" onerror="this.style.display='none';"></div><div style="text-align:center;font-weight:800;color:var(--navy);margin-top:12px;">${s.fullName}</div>`,`<button class="btn btn-primary" onclick="closeModal()">داخستن</button>`);
}

function renderStudentProfile(s){
  const records = state.attendance.filter(a=>a.studentId===s.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const perCourse = s.courseIds.map(cid=>{
    const cnt = state.attendance.filter(a=>a.studentId===s.id && a.courseId===cid).length;
    return { name: courseName(cid), cnt };
  });
  return `
  <div class="profile-head">
    ${s.photoUrl
      ? `<img src="${photoSrc(s.photoUrl)}" alt="${s.fullName}" title="کلیک بکە بۆ گەورەکردنی وێنە" onclick="showStudentPhoto('${s.id}')" style="width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;box-shadow:var(--shadow-sm);cursor:zoom-in;" onerror="this.outerHTML='<div class=&quot;profile-avatar&quot;>${initials(s.fullName)}</div>'">`
      : `<div class="profile-avatar">${initials(s.fullName)}</div>`}
    <div style="flex:1;">
      <div style="font-weight:800;font-size:17px;color:var(--navy);">${s.fullName}</div>
      <div style="font-size:12px;color:var(--muted);">تۆمارکراوە: ${new Date(s.createdAt).toLocaleDateString('en-GB')}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" onclick="openEditStudent('${s.id}')">${ICONS.edit.replace('width="24"','width="14"')} دەستکاریکردن</button>
      <button class="btn btn-outline btn-sm" onclick="showIdCard('${s.id}')">${ICONS.qr.replace('width="24"','width="14"')} کارتی ID</button>
      <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">${ICONS.trash.replace('width="24"','width="14"')} سڕینەوەی قوتابی</button>
    </div>
  </div>
  <div class="kv-list" style="margin-bottom:18px;">
    <div class="kv"><div class="k">تەمەن</div><div class="v">${s.age} ساڵ</div></div>
    <div class="kv"><div class="k">ڕەگەز</div><div class="v">${s.gender}</div></div>
    <div class="kv"><div class="k">ژمارەی مۆبایل</div><div class="v">${s.mobile}</div></div>
    <div class="kv"><div class="k">پیشە</div><div class="v">${s.profession}</div></div>
    <div class="kv"><div class="k">شار</div><div class="v">${s.city || '<span style="color:var(--muted);">دیارینەکراوە</span>'}</div></div>
    <div class="kv"><div class="k">سیڤی</div><div class="v">${s.cvUrl ? `<a href="${s.cvUrl}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700;">${ICONS.download ? ICONS.download.replace('width="24"','width="14"') : ''} کردنەوەی سیڤی</a>` : '<span style="color:var(--muted);">زیاد نەکراوە</span>'}</div></div>
  </div>
  <div style="margin-bottom:16px;">
    <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;">کۆرسەکان و ژمارەی ئامادەیی</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${perCourse.map(p=>`<span class="badge badge-green">${p.name} — ${p.cnt} جار</span>`).join('')}
    </div>
  </div>
  <div>
    <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;">مێژووی ئامادەیی (${records.length})</div>
    ${records.length===0 ? emptyState('هیچ تۆمارێکی ئامادەیی نییە') : `
    <div class="table-wrap" style="max-height:280px;overflow-y:auto;"><table>
      <thead><tr><th>بەروار</th><th>کۆرس</th><th>کات</th><th>شێواز</th></tr></thead>
      <tbody>
        ${records.map(a=>`<tr><td>${a.date}</td><td>${courseName(a.courseId)}</td><td>${a.time}</td><td>${a.method==='qr'?'کیو ئار':'دەستی'}</td></tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>`;
}

/* ==================== STAFF MANAGEMENT (admin) ==================== */
function renderStaffMgmt(){
  return `
  <div class="grid grid-2">
    <div class="card">
      <h3>${ICONS.plus.replace('width="24"','width="17"')} زیادکردنی هەژماری نوێ</h3>
      <form onsubmit="submitAddAccount(event)">
        <div class="field">
          <label>ناوی نیشاندان</label>
          <input type="text" id="newAccName" placeholder="ناوی تەواو" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label>ناوی بەکارهێنەر</label>
            <input type="text" id="newAccUser" placeholder="username" required>
          </div>
          <div class="field">
            <label>وشەی نهێنی</label>
            <input type="password" id="newAccPass" placeholder="وشەی نهێنی" required>
          </div>
        </div>
        <div class="field">
          <label>ڕۆڵ</label>
          <select id="newAccRole">
            <option value="staff">کارمەند</option>
            <option value="admin">ئەدمین</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">${ICONS.plus.replace('width="24"','width="16"')} زیادکردنی هەژمار</button>
      </form>
    </div>
    <div class="card">
      <h3>${ICONS.staff.replace('width="24"','width="17"')} هەژمارەکان (${state.accounts.length})</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>ناو</th><th>بەکارهێنەر</th><th>ڕۆڵ</th><th></th></tr></thead>
        <tbody>
          ${state.accounts.map(a=>`
            <tr>
              <td style="font-weight:700;">${a.name}</td>
              <td>${a.username}</td>
              <td>${a.role==='admin'?'<span class="badge badge-navy">ئەدمین</span>':'<span class="badge badge-green">کارمەند</span>'}</td>
              <td>${state.accounts.length>1 ? `<button class="btn btn-danger btn-sm" onclick="deleteAccount('${a.username}')">${ICONS.trash.replace('width="24"','width="14"')}</button>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  </div>`;
}
async function submitAddAccount(ev){
  ev.preventDefault();
  const name = document.getElementById('newAccName').value.trim();
  const username = document.getElementById('newAccUser').value.trim();
  const password = document.getElementById('newAccPass').value;
  const role = document.getElementById('newAccRole').value;
  if(state.accounts.some(a=>a.username===username)){ showToast('ئەم ناوی بەکارهێنەرە پێشتر بەکارهاتووە', 'error'); return; }
  state.accounts.push({ name, username, password, role });
  await saveAccounts();
  showToast('هەژمار زیادکرا', 'success');
  render();
}
async function deleteAccount(username){
  const admins = state.accounts.filter(a=>a.role==='admin');
  const target = state.accounts.find(a=>a.username===username);
  if(target.role==='admin' && admins.length<=1){ showToast('ناتوانرێت دوایین هەژماری ئەدمین بسڕدرێتەوە', 'error'); return; }
  if(!confirm('دڵنیایت لە سڕینەوەی ئەم هەژمارە؟')) return;
  state.accounts = state.accounts.filter(a=>a.username!==username);
  await saveAccounts();
  showToast('هەژمار سڕایەوە', 'info');
  render();
}

  <div class="settings-block">
    <div class="card">
      <h3>${ICONS.cloud.replace('width="24"','width="17"')} هەماهەنگی لەگەڵ Google Sheets</h3>
      <div class="note-box">هەموو داتاکان (قوتابی، کۆرس، ئامادەیی، هەژمار) ڕاستەوخۆ و بەخۆکاری لەگەڵ Google Sheets هاوکات دەبن — پێویست ناکات هیچ کاتێک بە دەستی بیانی نێریت. ${syncBadgeHtml()}</div>
      <div class="field">
        <label>دۆخی پەیوەندی</label>

      </div>

          <b>index.html</b> — خودی بەرنامەکە، لەسەر ئینتەرنێت هۆست دەکرێت.<br>
          <b>Code.gs</b> — کۆدی Google Apps Script، لەناو Google Sheet دادەنرێت (بڕوانە خوارەوە).

        دوای دیپلۆیکردنی Code.gs، لینکی Web App و TOKENـەکەت لەناو index.html، لە دەقی <code>SHEETS_URL</code> و <code>SHEETS_TOKEN</code> دابنێ، پاشان فایلەکە هۆست بکە. هەموو کارمەندێک کە هەمان index.html بەکاردەهێنێت خۆکارانە پەیوەست دەبێت.
      </div>
      <div style="margin-top:18px;">
        <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;">هەنگاوەکانی سازکردنی Google Sheets (یەک جار پێویستە):</div>
        <ol style="font-size:12.5px;color:var(--muted);line-height:2;padding-right:18px;margin:0;">
          <li>Google Sheet نوێ دروست بکە.</li>
          <li>لە مێنیوی Extensions &larr; Apps Script بکەرەوە.</li>
          <li>ناوەڕۆکی فایلی <b>Code.gs</b> (کە پێکەوە لەگەڵ index.html وەرگیراوە) بکۆپی بکە بۆ ناو Apps Script، و TOKEN بگۆڕە بۆ کۆدێکی نهێنی تایبەت بە خۆت.</li>
          <li>Deploy &larr; New deployment &larr; Web app، Execute as: Me، Who has access: Anyone.</li>
          <li>لینکی Web App کۆپی بکە و لەگەڵ هەمان TOKEN لەناو کۆدی index.html دابنێ (وەک سەرەوە باسکرا).</li>
        </ol>
        <div class="note-box warn" style="margin-top:10px;">تێبینی سەلامەتی: هەرکەسێک ئەم لینک و کۆدە نهێنییە بزانێت دەتوانێت داتاکان ببینێت. تەنها فایلی index.html بدە بە کەسانی متمانەپێکراو، و فایلی Code.gs (لەگەڵ TOKEN) بە شێوەی گشتی بڵاو مەکەوە.</div>
      </div>
    </div>

  <div class="settings-block">
    <div class="card">
      <h3>${ICONS.key.replace('width="24"','width="17"')} گۆڕینی وشەی نهێنی</h3>
      <button class="btn btn-outline" onclick="openChangePassword()">گۆڕینی وشەی نهێنی خۆم</button>
    </div>

}

function openChangePassword(){
  openModal('گۆڕینی وشەی نهێنی', `
    <div class="field"><label>وشەی نهێنی ئێستا</label><input type="password" id="curPass"></div>
    <div class="field"><label>وشەی نهێنی نوێ</label><input type="password" id="newPass"></div>
  `, `<button class="btn btn-primary" onclick="submitChangePassword()">پاشەکەوتکردن</button>
      <button class="btn btn-outline" onclick="closeModal()">پاشگەزبوونەوە</button>`);
}
async function submitChangePassword(){
  const cur = document.getElementById('curPass').value;
  const nw = document.getElementById('newPass').value;
  const acc = state.accounts.find(a=>a.username===state.session.username);
  if(!acc || acc.password !== cur){ showToast('وشەی نهێنی ئێستا هەڵەیە', 'error'); return; }
  if(!nw || nw.length<4){ showToast('وشەی نهێنی نوێ دەبێت لانیکەم ٤ پیت بێت', 'error'); return; }
  acc.password = nw;
  await saveAccounts();
  showToast('وشەی نهێنی گۆڕدرا', 'success');
  closeModal();
}

/* ==================== INIT ==================== */
loadAll();
